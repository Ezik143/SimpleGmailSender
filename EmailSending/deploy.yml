name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish application
        run: dotnet publish EmailSending/EmailSending.csproj -c Release -o publish

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.LIGHTSAIL_SSH_KEY }}' > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H '${{ secrets.LIGHTSAIL_HOST }}' >> ~/.ssh/known_hosts

      - name: Copy application
        run: |
          scp -i ~/.ssh/lightsail.pem -r publish/* \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/var/www/email-sending/

      - name: Restart application
        run: |
          ssh -i ~/.ssh/lightsail.pem ubuntu@${{ secrets.LIGHTSAIL_HOST }} \
            'sudo systemctl restart email-sending'
